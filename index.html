<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solid Glass - Texture you can feel. Clarity you can see.</title>
    <meta name="description" content="Solid Glass is a theme for shadcn/ui: thick, smoky panes with the weight of a solid surface and the clarity of glass." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <script>
      // Before first paint: the saved choice, otherwise dark, which is the material as designed.
      (function () {
        // ?theme=light or ?theme=dark shows that one for this visit, without saving it.
        var saved = new URLSearchParams(location.search).get("theme")
        try { saved = saved || localStorage.getItem("solid-glass:theme") } catch (e) {}
        document.documentElement.classList.toggle("dark", saved !== "light")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
