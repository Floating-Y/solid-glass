<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ComponentPreview behavior check</title>
  </head>
  <body>
    <main class="mx-auto max-w-3xl p-6">
      <h1 class="text-xl font-medium">ComponentPreview behavior check</h1>
      <pre id="results" role="status" class="my-4 whitespace-pre-wrap">Running…</pre>
      <div id="preview"></div>
    </main>
    <script type="module">
      import * as React from "react"
      import { createRoot } from "react-dom/client"
      import "/src/index.css"

      const output = document.getElementById("results")
      const host = document.getElementById("preview")
      const originalObserver = window.IntersectionObserver
      const originalActEnvironment = globalThis.IS_REACT_ACT_ENVIRONMENT
      const observers = []
      const passed = []
      let root
      globalThis.IS_REACT_ACT_ENVIRONMENT = true

      class ManualObserver {
        constructor(callback, options) {
          this.callback = callback
          this.options = options
          this.disconnected = false
          observers.push(this)
        }
        observe(target) { this.target = target }
        disconnect() { this.disconnected = true }
        // A queued browser callback can still arrive after disconnect().
        fire(isIntersecting) { this.callback([{ target: this.target, isIntersecting }], this) }
      }

      function check(condition, message) {
        if (!condition) throw new Error(message)
        passed.push(`PASS ${message}`)
        output.textContent = passed.join("\n")
      }

      function requests(name) {
        return performance.getEntriesByType("resource").map((entry) => new URL(entry.name))
          .filter((url) => url.pathname === `/src/examples/${name}.tsx`)
      }

      async function until(predicate, message) {
        const deadline = performance.now() + 15000
        while (!predicate()) {
          if (performance.now() > deadline) throw new Error(`Timed out: ${message}`)
          await React.act(() => new Promise((resolve) => setTimeout(resolve, 25)))
        }
      }

      try {
        window.IntersectionObserver = ManualObserver
        const { ComponentPreview } = await import("/src/site/component-preview.tsx")
        async function mount(name, hideCode = false) {
          root = createRoot(host)
          await React.act(async () => {
            root.render(React.createElement(React.StrictMode, null,
              React.createElement(ComponentPreview, { name, hideCode })))
          })
        }

        await mount("input-basic")
        await React.act(() => new Promise(requestAnimationFrame))
        check(!host.querySelector("input") && requests("input-basic").length === 0,
          "before activation: no example, no example or raw-source requests")
        check(observers.length === 2 && observers[0].disconnected,
          "StrictMode cleans up its first observer")
        check(observers.every((observer) => observer.options.rootMargin === "300px"),
          "previews use a 300px root margin")
        const observer = observers.at(-1)
        await React.act(async () => observer.fire(false))
        check(!host.querySelector("input") && requests("input-basic").length === 0,
          "a non-intersecting callback does not activate the preview")

        await React.act(async () => observer.fire(true))
        await until(() => host.querySelector("input") &&
          [...host.querySelectorAll("button")].some((button) => button.textContent === "View Code"),
          "first activation loads the example and source")
        await until(() => requests("input-basic").length >= 2, "example and source resource entries")
        check(requests("input-basic").some((url) => url.searchParams.has("raw")) &&
          requests("input-basic").some((url) => !url.searchParams.has("raw")),
          "first intersection requests both the example and raw source")
        const input = host.querySelector("input")
        const viewCode = [...host.querySelectorAll("button")].find((button) => button.textContent === "View Code")
        await React.act(async () => {
          input.value = "keep this input"
          input.dispatchEvent(new Event("input", { bubbles: true }))
          viewCode.click()
        })
        const code = host.querySelector('[data-slot="code"] code')
        check(code.textContent.includes("return <Input"), "View Code reveals the full source")
        await React.act(async () => { observer.fire(false); observer.fire(true) })
        check(host.querySelector("input") === input && input.value === "keep this input" &&
          host.querySelector('[data-slot="code"] code') === code &&
          ![...host.querySelectorAll("button")].some((button) => button.textContent === "View Code"),
          "after leaving and returning: input node, value and expanded code remain")
        await React.act(async () => root.unmount())

        await mount("input-demo", true)
        check(!host.querySelector("input") && requests("input-demo").length === 0,
          "hideCode preview also waits for its first intersection")
        await React.act(async () => observers.at(-1).fire(true))
        await until(() => host.querySelector("input"), "hideCode example")
        await until(() => requests("input-demo").length > 0, "hideCode example resource entry")
        check(!host.querySelector('[data-slot="code"]') &&
          requests("input-demo").every((url) => !url.searchParams.has("raw")),
          "hideCode loads the example without requesting its raw source")
        await React.act(async () => root.unmount())
        check(observers.every((item) => item.disconnected), "unmount disconnects every observer")

        window.IntersectionObserver = undefined
        const observerCount = observers.length
        await mount("input-invalid")
        await until(() => host.querySelector("input") && host.querySelector('[data-slot="code"] code'),
          "fallback without IntersectionObserver")
        check(observers.length === observerCount, "without IntersectionObserver, preview and source load immediately")
        await React.act(async () => root.unmount())
        output.dataset.result = "pass"
        output.textContent += "\nPASS All ComponentPreview behavior checks completed."
      } catch (error) {
        output.dataset.result = "fail"
        output.textContent = `${passed.join("\n")}\nFAIL ${error.stack ?? error}`
        console.error("ComponentPreview behavior check failed", error)
        throw error
      } finally {
        await React.act(async () => root?.unmount())
        window.IntersectionObserver = originalObserver
        globalThis.IS_REACT_ACT_ENVIRONMENT = originalActEnvironment
      }
    </script>
  </body>
</html>
