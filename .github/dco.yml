# Settings for the DCO bot (probot/dco).
#
# Members of the organization are not checked. When GitHub squash-merges, it rewrites the author to
# the account's noreply address while the Signed-off-by lines keep the address they were written
# with, and the bot wants the two to match exactly; a dev → main pull request then goes red on
# every one of our own commits. The DCO is for contributions from outside; members' commits are
# the organization's own to answer for.
require:
  members: false
# What is already merged cannot be rewritten on a protected branch. Where a sign-off was missed,
# a remediation commit is accepted in its place.
allowRemediationCommits:
  individual: true
  thirdParty: true
